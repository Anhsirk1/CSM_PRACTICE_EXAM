<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSM Practice Exam</title>
<style>
  :root{
    --teal:#12988a;
    --teal-dark:#0d7a6f;
    --bg:#f4f6f7;
    --card:#ffffff;
    --text:#1c2a2e;
    --muted:#6b7a7d;
    --border:#e3e8e9;
    --red:#d84c4c;
    --green:#1f9d5c;
    --amber:#c98a1f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:24px 16px 60px;
  }
  .eyebrow{
    text-align:center;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
  }
  h1{
    text-align:center;
    font-size:28px;
    margin:6px 0 10px;
  }
  h1 .accent{color:var(--teal);}
  .lede{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
    max-width:520px;
    margin:0 auto 22px;
  }
  .stats{
    display:flex;
    gap:12px;
    justify-content:center;
    margin-bottom:22px;
  }
  .stat-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 20px;
    text-align:center;
    min-width:96px;
  }
  .stat-box .num{
    font-size:22px;
    font-weight:700;
    color:var(--teal);
  }
  .stat-box .label{
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:2px;
  }
  .btn{
    display:inline-block;
    border:none;
    border-radius:10px;
    padding:13px 28px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-ghost:hover{background:#eef1f1;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .center{text-align:center;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}

  /* start screen options */
  .start-options{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-width:340px;
    margin:0 auto;
  }
  .mode-btn{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 16px;
    text-align:left;
    cursor:pointer;
    font-size:14px;
  }
  .mode-btn b{display:block;font-size:14px;color:var(--text);}
  .mode-btn span{font-size:12px;color:var(--muted);}
  .mode-btn.selected{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);}

  /* exam header */
  .exam-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:4px;
  }
  .exam-title{font-size:18px;font-weight:700;}
  .exam-title .accent{color:var(--teal);}
  .qcount{font-size:12px;color:var(--muted);font-family:monospace;}
  .answered{
    font-size:11px;
    color:var(--muted);
    font-family:monospace;
    margin-bottom:14px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    margin-bottom:14px;
  }
  .qtext{font-size:16px;font-weight:600;line-height:1.4;margin-bottom:6px;}
  .qhint{
    font-size:11px;
    color:var(--amber);
    font-family:monospace;
    margin-bottom:14px;
  }
  .option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:#f7f9f9;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
    cursor:pointer;
    font-size:14.5px;
    line-height:1.4;
    transition:background .1s,border-color .1s;
  }
  .option:hover{background:#eef3f3;}
  .option.selected{
    border-color:var(--teal);
    background:#e6f4f2;
  }
  .option.correct{
    border-color:var(--green);
    background:#e7f7ee;
  }
  .option.incorrect{
    border-color:var(--red);
    background:#fbeaea;
  }
  .opt-mark{
    flex:0 0 auto;
    width:20px;
    height:20px;
    border:2px solid #c3cbcc;
    margin-top:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:#fff;
    font-weight:700;
  }
  .opt-mark.checkbox{border-radius:5px;}
  .opt-mark.radio{border-radius:50%;}
  .option.selected .opt-mark{background:var(--teal);border-color:var(--teal);}
  .option.correct .opt-mark{background:var(--green);border-color:var(--green);}
  .option.incorrect .opt-mark{background:var(--red);border-color:var(--red);}
  .opt-label{font-weight:700;color:var(--muted);flex:0 0 auto;min-width:14px;}
  .opt-text{flex:1;}
  .review-tag{
    font-size:11px;
    font-weight:700;
    margin-left:8px;
    flex:0 0 auto;
  }
  .review-tag.correct-tag{color:var(--green);}
  .review-tag.incorrect-tag{color:var(--red);}

  .qnum-label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--teal);
    font-family:monospace;
    margin-bottom:6px;
    font-weight:700;
  }

  .nav-buttons{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(42px,1fr));
    gap:6px;
  }
  .gridbtn{
    aspect-ratio:1;
    border:1px solid var(--border);
    background:var(--card);
    border-radius:8px;
    font-size:12px;
    font-family:monospace;
    cursor:pointer;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .gridbtn.current{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset;font-weight:700;}
  .gridbtn.done{background:#e6f4f2;color:var(--teal-dark);border-color:#bfe3de;}
  .gridbtn.flagged{background:#fdf3e2;border-color:#f0d9a8;}
  .gridbtn.grid-correct{background:#e5f6ec;color:var(--green);border-color:#bfe6cf;}
  .gridbtn.grid-incorrect{background:#fbe9e9;color:var(--red);border-color:#f3c6c6;}

  /* results */
  .score-ring{
    width:150px;height:150px;border-radius:50%;
    margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--teal) calc(var(--pct) * 1%), #e3e8e9 0);
  }
  .score-ring-inner{
    width:118px;height:118px;border-radius:50%;
    background:var(--card);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .score-ring-inner .pctnum{font-size:28px;font-weight:800;color:var(--teal);}
  .score-ring-inner .pctsub{font-size:11px;color:var(--muted);}

  .review-item{margin-bottom:14px;}
  .review-item .qtext{font-size:14.5px;}
  .filter-bar{
    display:flex;
    gap:8px;
    justify-content:center;
    margin:16px 0 20px;
    flex-wrap:wrap;
  }
  .filter-chip{
    border:1px solid var(--border);
    background:var(--card);
    border-radius:20px;
    padding:6px 14px;
    font-size:12px;
    cursor:pointer;
    color:var(--muted);
  }
  .filter-chip.active{
    background:var(--teal);
    color:#fff;
    border-color:var(--teal);
  }
  .hidden{display:none !important;}
  .footer-note{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    margin-top:30px;
  }
  @media (max-width:420px){
    .stat-box{padding:10px 14px;min-width:80px;}
    h1{font-size:24px;}
  }

<script>
const QUESTIONS = JSON.parse(document.getElementById('quiz-data').textContent);
const TOTAL = QUESTIONS.length;
const STORAGE_KEY = 'csm_exam_progress_v2';
const STATS_KEY = 'csm_exam_stats_v1';

let state = null; // { order:[indices], answers:{qIndex:[labels]}, current:0, submitted:false }

function loadStats(){
  try { return JSON.parse(localStorage.getItem(STATS_KEY)) || { attempts:0, best:null }; }
  catch(e){ return { attempts:0, best:null }; }
}
function saveStats(s){ localStorage.setItem(STATS_KEY, JSON.stringify(s)); }

function newState(shuffle){
  let order = QUESTIONS.map((_,i)=>i);
  if(shuffle){
    for(let i=order.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [order[i],order[j]]=[order[j],order[i]];
    }
  }
  return { order, answers:{}, checked:{}, current:0, submitted:false };
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function correctCount(q){
  return q.options.filter(o=>o.correct).length;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(!state){
    renderStart(app);
  } else if(state.submitted){
    renderResults(app);
  } else {
    renderExam(app);
  }
}

function renderStart(app){
  const stats = loadStats();
  app.appendChild(el('div','eyebrow','CSM · CUSTOMER SERVICE MANAGEMENT'));
  app.appendChild(el('h1', null, 'Practice <span class="accent">Exam</span>'));
  app.appendChild(el('p','lede', `${TOTAL} questions pulled from the CSM practice question bank. Select an answer (or answers, where noted) for each question, then submit to see your score and a full review.`));

  const stats_row = el('div','stats');
  stats_row.appendChild(statBox(TOTAL,'Questions'));
  stats_row.appendChild(statBox(stats.attempts,'Attempts'));
  stats_row.appendChild(statBox(stats.best===null?'—':stats.best+'%','Best Score'));
  app.appendChild(stats_row);

  const opts = el('div','start-options');
  const modeState = { shuffle:false };

  const m1 = el('div','mode-btn selected');
  m1.innerHTML = '<b>In order</b><span>Questions 1 through '+TOTAL+', in sequence</span>';
  const m2 = el('div','mode-btn');
  m2.innerHTML = '<b>Shuffled</b><span>Random order each attempt</span>';
  m1.onclick = ()=>{ modeState.shuffle=false; m1.classList.add('selected'); m2.classList.remove('selected'); };
  m2.onclick = ()=>{ modeState.shuffle=true; m2.classList.add('selected'); m1.classList.remove('selected'); };
  opts.appendChild(m1);
  opts.appendChild(m2);
  app.appendChild(opts);

  const startWrap = el('div','center');
  startWrap.style.marginTop='22px';
  const startBtn = el('button','btn btn-primary','Start exam');
  startBtn.onclick = ()=>{ state = newState(modeState.shuffle); render(); window.scrollTo(0,0); };
  startWrap.appendChild(startBtn);
  app.appendChild(startWrap);

  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved){
    try{
      const s = JSON.parse(saved);
      if(s && !s.submitted && Object.keys(s.answers||{}).length>0){
        const resumeWrap = el('div','center');
        resumeWrap.style.marginTop='12px';
        const resumeBtn = el('button','btn btn-ghost','Resume previous attempt');
        resumeBtn.onclick = ()=>{ state = s; render(); window.scrollTo(0,0); };
        resumeWrap.appendChild(resumeBtn);
        app.appendChild(resumeWrap);
      }
    }catch(e){}
  }

  app.appendChild(el('p','footer-note','Your progress is saved automatically in this browser.'));
}

function statBox(num,label){
  const b = el('div','stat-box');
  b.appendChild(el('div','num',String(num)));
  b.appendChild(el('div','label',label));
  return b;
}

function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function renderExam(app){
  const qIndex = state.order[state.current];
  const q = QUESTIONS[qIndex];
  const answeredCount = Object.keys(state.answers).filter(k=>state.answers[k] && state.answers[k].length>0).length;
  const need = correctCount(q);
  const isMulti = need > 1;

  const header = el('div','exam-header');
  header.appendChild(el('div','exam-title','CSM <span class="accent">Practice Exam</span>'));
  header.appendChild(el('div','qcount', `Q${state.current+1} / ${TOTAL}`));
  app.appendChild(header);
  app.appendChild(el('div','answered', `ANSWERED: ${answeredCount}/${TOTAL}`));

  const card = el('div','card');
  card.appendChild(el('div','qtext', escapeHtml(q.text)));
  if(isMulti){
    card.appendChild(el('div','qhint', `Select ${need} answer${need>1?'s':''}`));
  }

  const selected = state.answers[qIndex] || [];
  const isChecked = !!state.checked[qIndex];
  const truth = q.options.filter(o=>o.correct).map(o=>o.label).sort();
  const wasCorrect = isChecked && selected.slice().sort().length===truth.length && selected.slice().sort().every((v,i)=>v===truth[i]);

  if(isChecked){
    card.appendChild(el('div','review-tag ' + (wasCorrect?'correct-tag':'incorrect-tag'), wasCorrect?'✓ Correct':'✗ Incorrect'));
  }

  q.options.forEach(opt=>{
    const row = el('div','option');
    const wasSelected = selected.includes(opt.label);
    if(isChecked){
      row.style.cursor='default';
      if(opt.correct) row.classList.add('correct');
      else if(wasSelected && !opt.correct) row.classList.add('incorrect');
    } else {
      if(wasSelected) row.classList.add('selected');
    }
    const markContent = isChecked ? (opt.correct ? '✓' : (wasSelected ? '✗' : '')) : (wasSelected ? '✓' : '');
    const mark = el('div', 'opt-mark ' + (isMulti?'checkbox':'radio'), markContent);
    row.appendChild(mark);
    row.appendChild(el('div','opt-label', opt.label));
    row.appendChild(el('div','opt-text', escapeHtml(opt.text)));
    if(!isChecked){
      row.onclick = ()=>{
        let sel = state.answers[qIndex] ? state.answers[qIndex].slice() : [];
        if(isMulti){
          if(sel.includes(opt.label)){
            sel = sel.filter(l=>l!==opt.label);
          } else {
            if(sel.length >= need) return; // cap at required number
            sel.push(opt.label);
          }
        } else {
          sel = [opt.label];
        }
        state.answers[qIndex] = sel;
        // instant feedback: reveal as soon as the required number of answers is selected
        if(sel.length >= need){
          state.checked[qIndex] = true;
        }
        persist();
        render();
      };
    }
    card.appendChild(row);
  });

  if(!isChecked && isMulti && selected.length > 0 && selected.length < need){
    card.appendChild(el('div','qhint', `${need - selected.length} more to select`));
  }

  app.appendChild(card);

  if(isChecked){
    const changeWrap = el('div','center');
    changeWrap.style.margin='10px 0 0';
    const changeBtn = el('button','btn btn-ghost','Change answer');
    changeBtn.onclick = ()=>{ state.checked[qIndex] = false; persist(); render(); };
    changeWrap.appendChild(changeBtn);
    app.appendChild(changeWrap);
  }

  const qlabel = el('div','qnum-label', `QUESTION ${state.current+1}`);
  app.appendChild(qlabel);

  const nav = el('div','nav-buttons');
  const prevBtn = el('button','btn btn-ghost','← Previous');
  prevBtn.disabled = state.current===0;
  prevBtn.onclick = ()=>{ state.current--; persist(); render(); window.scrollTo(0,0); };

  const rightGroup = el('div','row');
  const exitBtn = el('button','btn btn-ghost','Exit');
  exitBtn.style.marginRight='8px';
  exitBtn.onclick = ()=>{ if(confirm('Exit exam? Your progress will be saved.')){ state=null; render(); window.scrollTo(0,0);} };

  const isLast = state.current === TOTAL-1;
  const nextBtn = el('button','btn btn-primary', isLast ? 'Submit' : 'Next →');
  nextBtn.onclick = ()=>{
    if(isLast){
      submitExam();
    } else {
      state.current++;
      persist();
      render();
      window.scrollTo(0,0);
    }
  };

  rightGroup.appendChild(exitBtn);
  rightGroup.appendChild(nextBtn);

  nav.appendChild(prevBtn);
  nav.appendChild(rightGroup);
  app.appendChild(nav);

  // question grid
  const grid = el('div','grid');
  state.order.forEach((qi, idx)=>{
    const b = el('button','gridbtn', String(idx+1));
    if(idx===state.current) b.classList.add('current');
    if(state.checked[qi]){
      const qq = QUESTIONS[qi];
      const sel = (state.answers[qi]||[]).slice().sort();
      const tr = qq.options.filter(o=>o.correct).map(o=>o.label).sort();
      const ok = sel.length===tr.length && sel.every((v,i)=>v===tr[i]);
      b.classList.add(ok ? 'grid-correct' : 'grid-incorrect');
    } else {
      const ans = state.answers[qi];
      if(ans && ans.length>0) b.classList.add('done');
    }
    b.onclick = ()=>{ state.current = idx; persist(); render(); window.scrollTo(0,0); };
    grid.appendChild(b);
  });
  app.appendChild(grid);
}

function submitExam(){
  let correct = 0;
  QUESTIONS.forEach((q,qi)=>{
    const sel = (state.answers[qi]||[]).slice().sort();
    const truth = q.options.filter(o=>o.correct).map(o=>o.label).sort();
    if(sel.length===truth.length && sel.every((v,i)=>v===truth[i])) correct++;
  });
  state.submitted = true;
  state.score = correct;
  const pct = Math.round((correct/TOTAL)*100);
  const stats = loadStats();
  stats.attempts += 1;
  if(stats.best===null || pct > stats.best) stats.best = pct;
  saveStats(stats);
  persist();
  render();
  window.scrollTo(0,0);
}

function renderResults(app){
  const correct = state.score;
  const pct = Math.round((correct/TOTAL)*100);

  app.appendChild(el('div','eyebrow','EXAM COMPLETE'));
  app.appendChild(el('h1', null, 'Your <span class="accent">Results</span>'));

  const ring = el('div','score-ring');
  ring.style.setProperty('--pct', pct);
  const inner = el('div','score-ring-inner');
  inner.appendChild(el('div','pctnum', pct+'%'));
  inner.appendChild(el('div','pctsub', correct+' / '+TOTAL));
  ring.appendChild(inner);
  app.appendChild(ring);

  const stats_row = el('div','stats');
  const stats = loadStats();
  stats_row.appendChild(statBox(stats.attempts,'Attempts'));
  stats_row.appendChild(statBox(stats.best+'%','Best Score'));
  stats_row.appendChild(statBox(TOTAL-correct,'Missed'));
  app.appendChild(stats_row);

  const btnRow = el('div','center');
  btnRow.style.margin = '22px 0';
  const retryBtn = el('button','btn btn-primary','Try again');
  retryBtn.style.marginRight='10px';
  retryBtn.onclick = ()=>{ state = newState(false); persist(); render(); window.scrollTo(0,0); };
  const homeBtn = el('button','btn btn-ghost','Back to start');
  homeBtn.onclick = ()=>{ state = null; localStorage.removeItem(STORAGE_KEY); render(); window.scrollTo(0,0); };
  btnRow.appendChild(retryBtn);
  btnRow.appendChild(homeBtn);
  app.appendChild(btnRow);

  // filter bar
  const filterState = { mode:'all' };
  const filterBar = el('div','filter-bar');
  const chipAll = el('div','filter-chip active','All ('+TOTAL+')');
  const chipWrong = el('div','filter-chip','Missed ('+(TOTAL-correct)+')');
  const chipRight = el('div','filter-chip','Correct ('+correct+')');
  filterBar.appendChild(chipAll);
  filterBar.appendChild(chipWrong);
  filterBar.appendChild(chipRight);
  app.appendChild(filterBar);

  const reviewWrap = el('div','review-wrap');
  app.appendChild(reviewWrap);

  function isQuestionCorrect(qi){
    const q = QUESTIONS[qi];
    const sel = (state.answers[qi]||[]).slice().sort();
    const truth = q.options.filter(o=>o.correct).map(o=>o.label).sort();
    return sel.length===truth.length && sel.every((v,i)=>v===truth[i]);
  }

  function drawReview(){
    reviewWrap.innerHTML='';
    QUESTIONS.forEach((q,qi)=>{
      const ok = isQuestionCorrect(qi);
      if(filterState.mode==='wrong' && ok) return;
      if(filterState.mode==='right' && !ok) return;
      const sel = state.answers[qi] || [];
      const card = el('div','card review-item');
      const head = el('div','row');
      head.appendChild(el('div','qnum-label','QUESTION '+(qi+1)));
      head.appendChild(el('div', 'review-tag ' + (ok?'correct-tag':'incorrect-tag'), ok?'✓ Correct':'✗ Incorrect'));
      card.appendChild(head);
      card.appendChild(el('div','qtext', escapeHtml(q.text)));
      q.options.forEach(opt=>{
        const wasSelected = sel.includes(opt.label);
        const row = el('div','option');
        row.style.cursor='default';
        if(opt.correct) row.classList.add('correct');
        else if(wasSelected && !opt.correct) row.classList.add('incorrect');
        const mark = el('div','opt-mark checkbox', opt.correct? '✓' : (wasSelected? '✗' : ''));
        row.appendChild(mark);
        row.appendChild(el('div','opt-label', opt.label));
        row.appendChild(el('div','opt-text', escapeHtml(opt.text)));
        card.appendChild(row);
      });
      reviewWrap.appendChild(card);
    });
  }
  drawReview();

  chipAll.onclick = ()=>{ filterState.mode='all'; [chipAll,chipWrong,chipRight].forEach(c=>c.classList.remove('active')); chipAll.classList.add('active'); drawReview(); };
  chipWrong.onclick = ()=>{ filterState.mode='wrong'; [chipAll,chipWrong,chipRight].forEach(c=>c.classList.remove('active')); chipWrong.classList.add('active'); drawReview(); };
  chipRight.onclick = ()=>{ filterState.mode='right'; [chipAll,chipWrong,chipRight].forEach(c=>c.classList.remove('active')); chipRight.classList.add('active'); drawReview(); };
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// init: try to resume submitted/in-progress state directly only if user explicitly resumes from start screen
render();
</script>
</body>
</html>
